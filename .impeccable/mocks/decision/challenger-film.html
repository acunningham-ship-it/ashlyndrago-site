<!doctype html><html><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#08090b;color:#d9dde3;font-family:'Big Shoulders Text'}
.strip{position:absolute;left:180px;top:-40px;width:560px;height:1000px;background:#15171b;padding:0 70px}
.strip:before,.strip:after{content:'';position:absolute;top:0;bottom:0;width:30px;background:repeating-linear-gradient(#08090b 0 22px,transparent 22px 52px);}

.f{height:440px;margin:60px 0;background:url(../../../assets/img/ashlyn.jpg) center 30%/cover;box-shadow:0 0 0 2px #1e3c8c}

.code{position:absolute;left:150px;top:80px;writing-mode:vertical-rl;letter-spacing:.4em;font-size:14px;color:#8a919c}
.txt{position:absolute;left:820px;top:200px;width:520px}
.txt small{font-size:16px;letter-spacing:.4em;color:#6e8fe0}
.txt h1{font-weight:800;font-size:150px;line-height:.85;text-transform:uppercase;margin:20px 0}
.txt p{font-family:'Hanken Grotesk';font-size:19px;line-height:1.6;color:#aab0ba}
.nav{display:flex;gap:30px;margin-top:40px;font-size:20px;letter-spacing:.2em;text-transform:uppercase}
.nav a{color:#d9dde3;text-decoration:none;border-bottom:2px solid #1e3c8c}

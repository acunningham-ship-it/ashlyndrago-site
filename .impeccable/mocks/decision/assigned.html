<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Nanum+Pen+Script&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#07080b;font-family:'Hanken Grotesk',sans-serif;color:#ecebe6}
.book{position:absolute;left:60px;top:44px;width:1320px;height:812px;display:flex;filter:drop-shadow(0 30px 40px #000)}
.pg{flex:1;background:#121318;background-image:radial-gradient(#1a1c22 1px,transparent 1px);background-size:5px 5px;position:relative}
.l{border-radius:6px 0 0 6px;box-shadow:inset -30px 0 40px -20px #000}
.r{border-radius:0 6px 6px 0;box-shadow:inset 30px 0 40px -20px #000;padding:84px 80px}
.photo{position:absolute;left:120px;top:70px;width:440px;height:600px;background:url(../../../assets/img/ashlyn.jpg) center 30%/cover;transform:rotate(-2.2deg);border:10px solid #e9e7e1;border-bottom-width:44px}
.tape{position:absolute;width:130px;height:34px;background:rgba(110,143,224,.55);mix-blend-mode:screen}
.t1{left:90px;top:56px;transform:rotate(-24deg)}.t2{left:470px;top:640px;transform:rotate(-18deg)}
.cap{position:absolute;left:150px;top:690px;font-family:'Nanum Pen Script';font-size:34px;color:#1f3a8a;transform:rotate(-2deg)}
.note{font-family:'Nanum Pen Script';color:#6e8fe0;font-size:38px}
h1{font-family:Gloock;font-weight:400;font-size:132px;line-height:.9;letter-spacing:-.02em;margin:26px 0 30px}
.roles{display:flex;gap:28px;font-size:15px;letter-spacing:.24em;text-transform:uppercase}
.roles span:nth-child(2){color:#6e8fe0}
.idx{margin-top:70px;border-top:1px solid #2a2c33}
.idx a{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #2a2c33;color:#ecebe6;text-decoration:none;font-size:20px}
.idx a i{font-style:normal;font-family:'Nanum Pen Script';color:#6e8fe0;font-size:28px}
.circle{position:absolute;right:96px;top:70px;width:150px;height:76px;border:2px solid #6e8fe0;border-radius:50%;transform:rotate(-8deg)}
</style></head><body>
<div class="book">
 <div class="pg l"><div class="photo"></div><div class="tape t1"></div><div class="tape t2"></div><div class="cap">me, sept '26 ♡</div></div>
 <div class="pg r">
  <div class="note">sketchbook no. 1 —</div>
  <h1>Ashlyn<br>Jolene Drago</h1>
  <div class="roles"><span>Actress</span><span>Digital Artist</span></div>
  <div class="idx">
   <a href="#">Digital art <i>p. 02</i></a>
   <a href="#">Gallery <i>p. 08</i></a>
   <a href="#">On stage — what's next <i>p. 14</i></a>
   <a href="#">About me <i>p. 16</i></a>
   <a href="#">Say hi — ashlynjd@gmail.com <i>p. 18</i></a>
  </div>
  <div class="circle"></div>
 </div>
</div>
</body></html>
